<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>贪吃蛇</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: #0a0a0f;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    min-height: 100dvh;
    font-family: "Segoe UI", system-ui, sans-serif;
    overflow: hidden;
    user-select: none;
    -webkit-user-select: none;
    -webkit-tap-highlight-color: transparent;
  }

  .game-wrapper {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 16px;
  }

  .header {
    display: flex;
    align-items: center;
    gap: 24px;
    flex-wrap: wrap;
    justify-content: center;
  }

  .score-panel {
    background: #14141f;
    border: 1px solid #2a2a3a;
    border-radius: 12px;
    padding: 10px 20px;
    text-align: center;
    min-width: 100px;
    transition: border-color 0.3s, box-shadow 0.3s;
  }

  .score-panel.level-panel {
    border-color: #7c3aed;
    box-shadow: 0 0 8px rgba(124,58,237,0.15);
  }

  .speed-panel {
    min-width: 220px;
    padding: 10px 16px 12px;
    text-align: left;
  }

  .speed-head {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 8px;
  }

  .speed-title {
    color: #666;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 2px;
  }

  .speed-readout {
    color: #38bdf8;
    font-size: 14px;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
  }

  .speed-slider {
    width: 100%;
    height: 6px;
    appearance: none;
    -webkit-appearance: none;
    border-radius: 999px;
    background: linear-gradient(90deg, #4ade80, #38bdf8);
    outline: none;
  }

  .speed-slider::-webkit-slider-thumb {
    appearance: none;
    -webkit-appearance: none;
    width: 18px;
    height: 18px;
    border-radius: 50%;
    border: 2px solid #0a0a0f;
    background: #e2e8f0;
    box-shadow: 0 0 10px rgba(56,189,248,0.45);
    cursor: pointer;
  }

  .speed-slider::-moz-range-thumb {
    width: 18px;
    height: 18px;
    border-radius: 50%;
    border: 2px solid #0a0a0f;
    background: #e2e8f0;
    box-shadow: 0 0 10px rgba(56,189,248,0.45);
    cursor: pointer;
  }

  .score-label {
    color: #666;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 2px;
  }

  .score-value {
    color: #4ade80;
    font-size: 32px;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
  }

  .level-value {
    color: #c084fc;
    font-size: 32px;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
  }

  .level-progress {
    margin-top: 6px; width: 100%; height: 5px; border-radius: 999px; background: #1e1e2e; overflow: hidden;
  }

  .level-progress-bar {
    height: 100%; border-radius: 999px; background: linear-gradient(90deg, #7c3aed, #a78bfa, #c084fc); transition: width 0.25s ease;
  }

  .best-value {
    color: #f59e0b;
    font-size: 32px;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
  }

  .power-indicator {
    display: none;
    background: #1a1025;
    border: 1px solid #7c3aed;
    border-radius: 20px;
    padding: 6px 16px;
    font-size: 13px;
    color: #c084fc;
    font-weight: 600;
    animation: powerPulse 0.8s ease-in-out infinite alternate;
  }

  .mute-btn {
    width: 36px; height: 36px; border: 1px solid #2a2a3a; border-radius: 8px;
    background: #14141f; color: #999; font-size: 16px; cursor: pointer;
    display: flex; align-items: center; justify-content: center; transition: background 0.15s, color 0.15s;
    line-height: 1; padding: 0;
  }
  .mute-btn:hover { background: #2a2a3f; color: #fff; }
  .mute-btn.muted { color: #ef4444; }


  @keyframes powerPulse {
    from { box-shadow: 0 0 6px rgba(124,58,237,0.3); }
    to   { box-shadow: 0 0 16px rgba(124,58,237,0.6); }
  }

  .combo-pop {
    position: fixed;
    pointer-events: none;
    color: #facc15;
    font-size: 28px;
    font-weight: 900;
    text-shadow: 0 0 12px rgba(250,204,21,0.6);
    animation: comboUp 0.9s ease-out forwards;
    z-index: 20;
  }

  @keyframes comboUp {
    0%   { opacity: 1; transform: translateY(0) scale(1); }
    100% { opacity: 0; transform: translateY(-60px) scale(1.4); }
  }

  @keyframes scoreFloat {
    0%   { opacity: 1; transform: translateY(0) scale(1); }
    100% { opacity: 0; transform: translateY(-50px) scale(1.2); }
  }

  canvas {

    border: 2px solid #2a2a3a;
    border-radius: 8px;
    display: block;
    background: #0d0d18;
    transition: border-color 0.15s, box-shadow 0.15s;
    max-width: calc(100vw - 16px);
    max-height: calc(70dvh - 16px);
  }

  canvas.wall-danger {
    border-color: #ef4444;
    box-shadow: 0 0 16px rgba(239,68,68,0.4), inset 0 0 16px rgba(239,68,68,0.15);
  }

  canvas.wall-warn {
    border-color: #f59e0b;
    box-shadow: 0 0 10px rgba(245,158,11,0.3);
  }

  .controls {
    display: none;
    gap: 4px;
  }

  .controls-row {
    display: flex;
    gap: 4px;
    justify-content: center;
  }

  .ctrl-btn {
    width: 56px;
    height: 56px;
    border: 1px solid #2a2a3a;
    border-radius: 12px;
    background: #14141f;
    color: #888;
    font-size: 22px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.1s;
    -webkit-tap-highlight-color: transparent;
  }

  .ctrl-btn:active { background: #2a2a3f; color: #fff; }

  .overlay {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: rgba(0,0,0,0.7);
    z-index: 10;
  }

  .overlay-card {
    background: #14141f;
    border: 1px solid #2a2a3a;
    border-radius: 16px;
    padding: 40px 48px;
    text-align: center;
    max-width: 90vw;
  }

  .countdown-number {
    color: #fff;
    font-size: 80px;
    font-weight: 900;
    line-height: 1;
    text-shadow: 0 0 40px rgba(255,255,255,0.3);
    animation: countPop 0.5s ease-out;
  }

  @keyframes countPop {
    0%   { transform: scale(2); opacity: 0; }
    50%  { transform: scale(0.9); opacity: 1; }
    100% { transform: scale(1); opacity: 1; }
  }

  .overlay-hint {
    color: #555;
    font-size: 11px;
    margin-top: 12px;
    letter-spacing: 1px;
  }

  .overlay-title {
    color: #fff;
    font-size: 28px;
    font-weight: 700;
    margin-bottom: 8px;
  }

  .overlay-sub {
    color: #666;
    font-size: 14px;
    margin-bottom: 24px;
  }

  .speed-note {
    color: #94a3b8;
    font-size: 12px;
    margin-top: 8px;
    line-height: 1.4;
  }

  .overlay-score {
    color: #4ade80;
    font-size: 48px;
    font-weight: 700;
    margin-bottom: 24px;
  }

  .btn {
    background: #4ade80;
    color: #0a0a0f;
    border: none;
    border-radius: 10px;
    padding: 12px 32px;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.15s;
  }

  .btn:hover { background: #22c55e; }

  .btn-secondary {
    background: #2a2a3a;
    color: #aaa;
    border: 1px solid #3a3a4a;
    border-radius: 10px;
    padding: 10px 24px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.15s;
    margin-top: 8px;
  }

  .btn-secondary:hover { background: #3a3a4f; }

  @media (max-width: 600px) {
    .controls { display: flex; flex-direction: column; }
    .header { gap: 12px; }
    .score-panel { padding: 8px 14px; min-width: 80px; }
    .speed-panel { min-width: 100%; order: 99; }
    .score-value, .best-value { font-size: 26px; }
    .level-value { font-size: 26px; }
    .power-indicator { font-size: 11px; padding: 4px 12px; }
    .overlay-card { padding: 28px 32px; }
    .overlay-title { font-size: 24px; }
  }

  @media (max-width: 380px) {
    .header { gap: 8px; }
    .score-panel { padding: 6px 10px; min-width: 70px; }
    .score-value, .best-value, .level-value { font-size: 22px; }
    .score-label { font-size: 9px; }
    .speed-panel { padding: 8px 12px 10px; }
  }
  @media (max-width: 380px) {
    .header { gap: 8px; }
    .score-panel { padding: 6px 10px; min-width: 70px; }
    .score-value, .best-value, .level-value { font-size: 22px; }
    .score-label { font-size: 9px; }
    .speed-panel { padding: 8px 12px 10px; }
  }

  /* ── Enhanced Overlay Styles ────────────────────── */
  .overlay { background: rgba(5,5,15,0.82); backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px); }
  .overlay-card {
    background: linear-gradient(145deg, #161625, #1a1a2e);
    border: 1px solid rgba(124,58,237,0.25); border-radius: 20px;
    padding: 36px 48px 32px; text-align: center; max-width: 92vw;
    position: relative; overflow: hidden;
    box-shadow: 0 0 60px rgba(74,222,128,0.06), 0 0 120px rgba(124,58,237,0.04);
    animation: cardAppear 0.5s ease-out;
  }
  .overlay-card::before {
    content: "";
    position: absolute; top: -50%; left: -50%; width: 200%; height: 200%;
    background: conic-gradient(from 0deg at 50% 50%, transparent 0deg, rgba(74,222,128,0.03) 90deg, transparent 180deg, rgba(124,58,237,0.03) 270deg, transparent 360deg);
    animation: cardRotate 10s linear infinite; pointer-events: none; z-index: 0;
  }
  .overlay-card > * { position: relative; z-index: 1; }
  @keyframes cardRotate { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
  @keyframes cardAppear { from { opacity: 0; transform: translateY(20px) scale(0.96); } to { opacity: 1; transform: translateY(0) scale(1); } }
  .overlay-logo { position: relative; display: flex; align-items: center; justify-content: center; gap: 14px; margin-bottom: 8px; padding-top: 8px; }
  .logo-icon { font-size: 42px; line-height: 1; animation: logoBounce 2s ease-in-out infinite; filter: drop-shadow(0 0 12px rgba(74,222,128,0.4)); }
  @keyframes logoBounce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }
  .logo-ring { position: absolute; width: 80px; height: 80px; border: 2px solid rgba(74,222,128,0.12); border-radius: 50%; top: 50%; left: 50%; transform: translate(-50%, -50%); animation: ringPulse 2.5s ease-in-out infinite; }
  @keyframes ringPulse { 0%, 100% { width: 80px; height: 80px; opacity: 0.5; border-color: rgba(74,222,128,0.12); } 50% { width: 96px; height: 96px; opacity: 0.2; border-color: rgba(74,222,128,0.05); } }
  .overlay-title { color: #fff; font-size: 36px; font-weight: 800; letter-spacing: 4px; background: linear-gradient(135deg, #4ade80 0%, #38bdf8 50%, #c084fc 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; filter: drop-shadow(0 0 20px rgba(74,222,128,0.3)); }
  .overlay-title.title-gameover { background: linear-gradient(135deg, #ef4444 0%, #f97316 50%, #facc15 100%); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; filter: drop-shadow(0 0 20px rgba(239,68,68,0.3)); }
  .title-glow { position: absolute; width: 120px; height: 120px; border-radius: 50%; background: radial-gradient(circle, rgba(74,222,128,0.08) 0%, transparent 70%); top: 50%; left: 50%; transform: translate(-50%, -50%); pointer-events: none; }
  .overlay-sub { color: #94a3b8; font-size: 13px; margin-bottom: 20px; letter-spacing: 2px; animation: subFadeIn 0.6s ease-out 0.15s both; }
  @keyframes subFadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
  .start-extras { animation: extrasFadeIn 0.6s ease-out 0.3s both; }
  @keyframes extrasFadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
  .start-best { display: flex; align-items: center; justify-content: center; gap: 8px; background: rgba(245,158,11,0.08); border: 1px solid rgba(245,158,11,0.15); border-radius: 30px; padding: 6px 18px; margin: 0 auto 16px; width: fit-content; transition: border-color 0.3s; }
  .start-best:hover { border-color: rgba(245,158,11,0.35); }
  .best-label { font-size: 12px; color: #f59e0b; letter-spacing: 1px; }
  .best-num { font-size: 22px; font-weight: 800; color: #fbbf24; font-variant-numeric: tabular-nums; text-shadow: 0 0 10px rgba(251,191,36,0.3); }
  .showcase-divider { display: flex; align-items: center; justify-content: center; gap: 12px; margin-bottom: 12px; }
  .showcase-divider span { font-size: 11px; color: #64748b; letter-spacing: 2px; }
  .showcase-divider::before, .showcase-divider::after { content: ""; flex: 1; max-width: 40px; height: 1px; background: linear-gradient(90deg, transparent, rgba(100,116,139,0.3)); }
  .showcase-divider::after { background: linear-gradient(90deg, rgba(100,116,139,0.3), transparent); }
  .power-showcase { display: flex; justify-content: center; gap: 8px; margin-bottom: 20px; flex-wrap: wrap; }
  .showcase-item { display: flex; flex-direction: column; align-items: center; gap: 3px; background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.06); border-radius: 12px; padding: 8px 14px; min-width: 64px; transition: all 0.25s ease; cursor: default; }
  .showcase-item:hover { background: rgba(255,255,255,0.06); border-color: rgba(255,255,255,0.12); transform: translateY(-2px); }
  .showcase-item[data-power="lightning"]:hover { border-color: #facc15; box-shadow: 0 0 12px rgba(250,204,21,0.15); }
  .showcase-item[data-power="ghost"]:hover { border-color: #818cf8; box-shadow: 0 0 12px rgba(129,140,248,0.15); }
  .showcase-item[data-power="diamond"]:hover { border-color: #38bdf8; box-shadow: 0 0 12px rgba(56,189,248,0.15); }
  .showcase-item[data-power="tornado"]:hover { border-color: #a3e635; box-shadow: 0 0 12px rgba(163,230,53,0.15); }
  .showcase-icon { font-size: 22px; line-height: 1; }
  .showcase-name { font-size: 10px; color: #94a3b8; font-weight: 600; letter-spacing: 1px; }
  .showcase-item[data-power="lightning"] .showcase-icon { filter: drop-shadow(0 0 6px rgba(250,204,21,0.5)); }
  .showcase-item[data-power="ghost"] .showcase-icon { filter: drop-shadow(0 0 6px rgba(129,140,248,0.5)); }
  .showcase-item[data-power="diamond"] .showcase-icon { filter: drop-shadow(0 0 6px rgba(56,189,248,0.5)); }
  .showcase-item[data-power="tornado"] .showcase-icon { filter: drop-shadow(0 0 6px rgba(163,230,53,0.5)); }
  .start-btn-pulse { position: relative; background: linear-gradient(135deg, #4ade80, #22c55e); color: #0a0a0f; border: none; border-radius: 12px; padding: 14px 40px; font-size: 17px; font-weight: 700; letter-spacing: 1px; cursor: pointer; transition: all 0.25s ease; box-shadow: 0 0 20px rgba(74,222,128,0.2), inset 0 1px 0 rgba(255,255,255,0.3); overflow: hidden; }
  .start-btn-pulse::before { content: ""; position: absolute; inset: -2px; border-radius: 14px; background: linear-gradient(135deg, #4ade80, #38bdf8, #c084fc, #4ade80); background-size: 300% 300%; z-index: -1; animation: btnBorderGlow 3s ease-in-out infinite; opacity: 0; transition: opacity 0.3s ease; }
  .start-btn-pulse:hover::before { opacity: 1; }
  .start-btn-pulse:hover { transform: translateY(-2px); box-shadow: 0 0 30px rgba(74,222,128,0.35), inset 0 1px 0 rgba(255,255,255,0.3); }
  .start-btn-pulse:active { transform: translateY(0); box-shadow: 0 0 15px rgba(74,222,128,0.2); }
  .start-btn-pulse span { position: relative; z-index: 1; }
  @keyframes btnBorderGlow { 0%, 100% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } }
  .countdown-number { font-size: 80px; font-weight: 900; line-height: 1; background: linear-gradient(135deg, #fff 0%, #4ade80 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; filter: drop-shadow(0 0 40px rgba(74,222,128,0.3)); animation: countPop 0.5s ease-out; }
  .overlay-score { font-size: 56px; font-weight: 900; margin-bottom: 20px; background: linear-gradient(135deg, #4ade80 0%, #38bdf8 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; filter: drop-shadow(0 0 30px rgba(74,222,128,0.3)); animation: scorePulse 1.5s ease-in-out infinite; }
  @keyframes scorePulse { 0%, 100% { filter: drop-shadow(0 0 20px rgba(74,222,128,0.3)); } 50% { filter: drop-shadow(0 0 40px rgba(74,222,128,0.5)); } }
  .speed-note { color: #64748b; font-size: 11px; margin-top: 10px; letter-spacing: 0.5px; animation: subFadeIn 0.6s ease-out 0.45s both; }
  .overlay-hint { margin-top: 14px; color: #475569; font-size: 11px; letter-spacing: 1px; animation: subFadeIn 0.6s ease-out 0.5s both; }
  @media (max-width: 600px) {
    .overlay-card { padding: 28px 24px 24px; }
    .overlay-title { font-size: 28px; letter-spacing: 3px; }
    .logo-icon { font-size: 34px; }
    .logo-ring { width: 64px; height: 64px; }
    .start-btn-pulse { padding: 12px 32px; font-size: 15px; }
    .overlay-score { font-size: 42px; }
    .power-showcase { gap: 6px; }
    .showcase-item { padding: 6px 10px; min-width: 52px; }
    .showcase-icon { font-size: 18px; }
    .showcase-name { font-size: 9px; }
    .countdown-number { font-size: 60px; }
  }
  @media (max-width: 380px) {
    .overlay-card { padding: 20px 16px; }
    .overlay-title { font-size: 24px; letter-spacing: 2px; }
    .logo-icon { font-size: 28px; }
    .showcase-item { min-width: 44px; padding: 4px 8px; }
    .start-btn-pulse { padding: 10px 24px; font-size: 14px; }
    .overlay-score { font-size: 34px; }
  }
</style>
</head>
<body>

<div class="game-wrapper">
  <div class="header">
    <div class="score-panel">
      <div class="score-label">得分</div>
      <div class="score-value" id="score">0</div>
    </div>
    <div class="score-panel">
      <div class="score-label">最佳</div>
      <div class="best-value" id="best">0</div>
    </div>
    <div class="score-panel level-panel" id="levelPanel">
      <div class="score-label">等级</div>
      <div class="level-value" id="level">1</div>
      <div class="level-progress"><div class="level-progress-bar" id="levelProgress"></div></div>
    </div>
    <div class="score-panel speed-panel" id="speedPanel">
      <div class="speed-head">
        <div class="speed-title">速度</div>
        <div class="speed-readout" id="speedReadout">140ms/步</div>
      </div>
      <input type="range" id="speedSlider" class="speed-slider" min="60" max="240" step="5" value="140" aria-label="调节贪吃蛇运行速度">
    </div>
    <div class="score-panel" id="statsPanel" style="display:none">
      <div class="score-label">吃下</div>
      <div class="level-value" id="eaten" style="color:#38bdf8">0</div>
    </div>
    <div class="power-indicator" id="powerIndicator"></div>
    <button class="mute-btn" id="muteBtn" title="声音开关">🔊</button>
  </div>
  <canvas id="game"></canvas>
  <div class="controls" id="controls">
    <div class="controls-row">
      <div class="ctrl-btn" data-dir="up">▲</div>
    </div>
    <div class="controls-row">
      <div class="ctrl-btn" data-dir="left">◀</div>
      <div class="ctrl-btn" data-dir="down">▼</div>
      <div class="ctrl-btn" data-dir="right">▶</div>
    </div>
  </div>
</div>

<div class="overlay" id="pauseOverlay" style="display:none">
  <div class="overlay-card pause-modal">
    <div class="overlay-title" style="margin-bottom:4px">⏸ 暂停</div>
    <div class="overlay-sub" style="margin-bottom:28px">游戏已暂停</div>
    <button class="btn" id="resumeBtn">继续游戏</button>
    <button class="btn btn-secondary" id="quitBtn" style="display:block;margin:10px auto 0">退出游戏</button>
  </div>
</div>
<div class="overlay" id="overlay">
  <div class="overlay-card">
    <div id="countdownArea"></div>
    <div id="messageArea">
      <div class="overlay-logo">
        <div class="logo-ring"></div>
        <div class="logo-icon">🐍</div>
        <div class="overlay-title" id="overlayTitle">贪吃蛇</div>
        <div class="title-glow"></div>
      </div>
      <div class="overlay-sub" id="overlaySub">按方向键或滑动屏幕开始</div>
      <div class="overlay-score" id="overlayScore" style="display:none">0</div>
      <div id="startExtras" class="start-extras">
        <div class="start-best" id="startBest">
          <span class="best-label">🏆 历史最佳</span>
          <span class="best-num" id="startBestValue">0</span>
        </div>
        <div class="showcase-divider"><span>✦ 能力介绍 ✦</span></div>
        <div class="power-showcase" id="powerShowcase">
          <div class="showcase-item" data-power="lightning">

</div><script>

let snake, foods, powerFood, particles, dir, nextDir, score, best, gameLoop, speed, growing;

const FOOD_TYPES = [

// ── Sound System ──────────────────────────────────────────
let audioCtx = null;

function ensureAudioCtx() {
  if (!audioCtx) {
    try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e) {}
  }
  if (audioCtx && audioCtx.state === "suspended") {
    audioCtx.resume();
  }
  return audioCtx;
}

function playTone(freq, type, duration, vol, rampDown) {
  if (soundMuted) return;
  var ac = ensureAudioCtx();
  if (!ac) return;
  var now = ac.currentTime;
  var osc = ac.createOscillator();
  var gain = ac.createGain();
  osc.type = type || "square";
  osc.frequency.setValueAtTime(freq, now);
  gain.gain.setValueAtTime(vol || 0.08, now);
  if (rampDown !== false) {
    gain.gain.exponentialRampToValueAtTime(0.001, now + duration);
  }
  osc.connect(gain);
  gain.connect(ac.destination);
  osc.start(now);
  osc.stop(now + duration);
}

function sfxEat() {
  playTone(520, "square", 0.08, 0.06);
  setTimeout(function() { playTone(680, "square", 0.06, 0.05); }, 50);
}

function sfxPowerUp() {
  playTone(440, "square", 0.12, 0.08);
  setTimeout(function() { playTone(660, "triangle", 0.1, 0.07); }, 80);
  setTimeout(function() { playTone(880, "triangle", 0.1, 0.06); }, 160);
  setTimeout(function() { playTone(1100, "sawtooth", 0.15, 0.05); }, 240);
}

function sfxDeath() {
  playTone(200, "sawtooth", 0.3, 0.1);
  setTimeout(function() { playTone(150, "sawtooth", 0.3, 0.08); }, 120);
  setTimeout(function() { playTone(100, "triangle", 0.4, 0.06); }, 240);
}

function sfxCombo(n) {
  var baseFreq = 600 + n * 80;
  playTone(baseFreq, "triangle", 0.1, 0.07);
  setTimeout(function() { playTone(baseFreq * 1.25, "triangle", 0.08, 0.06); }, 60);
}

function sfxLevelUp() {
  var notes = [523, 659, 784, 1047];
  notes.forEach(function(f, i) {
    setTimeout(function() { playTone(f, "triangle", 0.15, 0.06); }, i * 80);
  });
}

function sfxCountdown() {
  playTone(440, "triangle", 0.15, 0.06, false);
}

function sfxGo() {
  playTone(880, "triangle", 0.2, 0.08);
}

// ── Init ──────────────────────────────────────────────────
function init() {
  var cx = Math.floor(COLS / 2);
  var cy = Math.floor(ROWS / 2);
  snake = [
    { x: cx, y: cy },
    { x: cx - 1, y: cy },
    { x: cx - 2, y: cy },
  ];
  dir = { x: 1, y: 0 };
  nextDir = { x: 1, y: 0 };
  score = 0;
  level = 1;
  totalEaten = 0;
  combo = 0;
  lastEatTime = 0;
  baseSpeed = userBaseSpeed;
  speed = baseSpeed;
  lastTickTime = 0;
  growing = 0;
  foods = [];
  powerFood = null;
  activePower = null;
  powerTimer = 0;
  particles = [];
  paused = false;
  gameRunning = false;
  scoreEl.textContent = "0";
  levelProgressEl.style.width = "0%";
  levelEl.textContent = "1";
  eatenEl.textContent = "0";
  updateSpeedReadout(speed, false);
  powerEl.style.display = "none";
  statsPanel.style.display = "none";
  levelPanel.style.display = "none";
  canvas.classList.remove("wall-danger", "wall-warn");
  placeFoods();
  startExtras.style.display = "block";
  overlayTitle.classList.remove("title-gameover");
  startBestValue.textContent = best;
  trySpawnPower();
  stars = []
  for (var i = 0; i < 60; i++) {
    stars.push({
      x: Math.random() * canvas.width,
      y: Math.random() * canvas.height,
      size: 0.5 + Math.random() * 2,
      phase: Math.random() * Math.PI * 2,
      speed: 0.5 + Math.random() * 1.5,
      color: ['#fff','#93c5fd','#f9a8d4','#fef08a'][Math.floor(Math.random()*4)],
    })
  }

  generateObstacles();
}

function sfxTornado() {
  var freqs = [200, 240, 280, 320, 360, 400];
  freqs.forEach(function(f, idx) {
    setTimeout(function() { playTone(f, "sawtooth", 0.12, 0.05); }, idx * 30);
  });
}

function randomFoodType() {
  return FOOD_TYPES[Math.floor(Math.random() * FOOD_TYPES.length)];
}

function randomPowerType() {
  return POWER_TYPES[Math.floor(Math.random() * POWER_TYPES.length)];
}

function trySpawnPower() {
  if (powerFood) return;
  if (Math.random() > POWER_SPAWN_CHANCE) return;
  var occupied = new Set([
    ...snake.map(function(s) { return s.x + "," + s.y; }),
    ...foods.map(function(f) { return f.x + "," + f.y; }),
  ]);
  var free = [];
  for (var x = 0; x < COLS; x++) {
    for (var y = 0; y < ROWS; y++) {
      if (!occupied.has(x + "," + y)) free.push({ x: x, y: y });
    }
  }
  if (free.length === 0) return;
  var pos = free[Math.floor(Math.random() * free.length)];
  powerFood = { x: pos.x, y: pos.y, type: randomPowerType() };
}

function placeFoods() {
  var occupied = new Set([
    ...snake.map(function(s) { return s.x + "," + s.y; }),
    ...foods.map(function(f) { return f.x + "," + f.y; }),
  ]);
  if (powerFood) occupied.add(powerFood.x + "," + powerFood.y);
  var free = [];
  for (var x = 0; x < COLS; x++) {
    for (var y = 0; y < ROWS; y++) {
      if (!occupied.has(x + "," + y)) free.push({ x: x, y: y });
    }
  }
  while (foods.length < MAX_FOODS && free.length > 0) {
    var idx = Math.floor(Math.random() * free.length);
    var pos = free[idx];
    foods.push({ x: pos.x, y: pos.y, type: randomFoodType() });
    free.splice(idx, 1);
  }
}

function spawnParticles(x, y, color, count) {
  count = count || 10;
  for (var i = 0; i < count; i++) {
    var angle = Math.random() * Math.PI * 2;
    var spd = 1.5 + Math.random() * 4;
    particles.push({
      x: x * GRID + GRID / 2 + (Math.random() - 0.5) * GRID * 0.6,
      y: y * GRID + GRID / 2 + (Math.random() - 0.5) * GRID * 0.6,
      vx: Math.cos(angle) * spd,
      vy: Math.sin(angle) * spd,
      color: color,
      life: 1,
      decay: 0.025 + Math.random() * 0.035,
    });
  }
}

function spawnComboPop(x, y, text) {
  var pop = document.createElement("div");
  pop.className = "combo-pop";
  pop.textContent = text;
  var rect = canvas.getBoundingClientRect();
  pop.style.left = (rect.left + x * GRID + GRID / 2) + "px";
  pop.style.top = (rect.top + y * GRID - 10) + "px";
  document.body.appendChild(pop);
  setTimeout(function() { pop.remove(); }, 900);
}


function spawnScorePopup(x, y, text, color) {
  var pop = document.createElement('div');
  pop.style.cssText = 'position:fixed;pointer-events:none;color:' + (color || '#4ade80') + ';font-size:22px;font-weight:900;text-shadow:0 0 8px ' + (color || '#4ade80') + '60;animation:scoreFloat 1.5s ease-out forwards;z-index:15;';
  pop.textContent = text;
  var rect = canvas.getBoundingClientRect();
  pop.style.left = (rect.left + x * GRID + GRID / 2) + 'px';
  pop.style.top = (rect.top + y * GRID - 10) + 'px';
  document.body.appendChild(pop);
  setTimeout(function() { pop.remove(); }, 1500);
}

function updateLevelProgress() {
  var progress = ((totalEaten % LEVEL_UP_EVERY) / LEVEL_UP_EVERY) * 100;
  levelProgressEl.style.width = progress + '%';
}


function generateObstacles() {
  if (level < 6) { obstacles = []; return; }
  var count = Math.min(level - 5, 8);
  var cx2 = Math.floor(COLS / 2);
  var cy2 = Math.floor(ROWS / 2);
  var occupied = {};
  for (var si = 0; si < snake.length; si++) {
    occupied[snake[si].x + "," + snake[si].y] = true;
  }
  for (var fi = 0; fi < foods.length; fi++) {
    occupied[foods[fi].x + "," + foods[fi].y] = true;
  }
  if (powerFood) {
    occupied[powerFood.x + "," + powerFood.y] = true;
  }
  for (var oi = 0; oi < obstacles.length; oi++) {
    occupied[obstacles[oi].x + "," + obstacles[oi].y] = true;
  }
  // Reserve center 3x3 + 1 margin
  for (var dx = -2; dx <= 2; dx++) {
    for (var dy = -2; dy <= 2; dy++) {
      occupied[(cx2 + dx) + "," + (cy2 + dy)] = true;
    }
  }
  // Reserve edges
  for (var ex = 0; ex < COLS; ex++) {
    occupied[ex + ",0"] = true;
    occupied[ex + "," + (ROWS - 1)] = true;
  }
  for (var ey = 0; ey < ROWS; ey++) {
    occupied["0," + ey] = true;
    occupied[(COLS - 1) + "," + ey] = true;
  }
  var free = [];
  for (var x = 0; x < COLS; x++) {
    for (var y = 0; y < ROWS; y++) {
      if (!occupied[x + "," + y]) free.push({ x: x, y: y });
    }
  }
  obstacles = [];
  for (var ci = 0; ci < count && free.length > 0; ci++) {
    var idx = Math.floor(Math.random() * free.length);
    obstacles.push(free[idx]);
    free.splice(idx, 1);
  }
}

function checkLevelUp() {
  var newLevel = Math.floor(totalEaten / LEVEL_UP_EVERY) + 1;
  if (newLevel > level) {
    level = newLevel;
    levelEl.textContent = level;
    levelPanel.style.display = "block";
    baseSpeed = Math.max(45, userBaseSpeed - (level - 1) * 8);
    speed = baseSpeed;
    if (activePower && activePower.id === "lightning") speed = Math.max(30, baseSpeed / 2);
    sfxLevelUp();
    levelPanel.style.boxShadow = "0 0 20px rgba(124,58,237,0.6)";
    setTimeout(function() { levelPanel.style.boxShadow = ""; }, 400);
    generateObstacles();
  }
}

// ── Wall danger ───────────────────────────────────────────
function updateWallDanger(head) {
  if (activePower && activePower.id === "ghost") {
    canvas.classList.remove("wall-danger", "wall-warn");
    return;
  }
  var distLeft = head.x;
  var distRight = COLS - 1 - head.x;
  var distTop = head.y;
  var distBottom = ROWS - 1 - head.y;
  var minDist = Math.min(distLeft, distRight, distTop, distBottom);
  if (minDist === 0) {
    canvas.classList.add("wall-danger");
    canvas.classList.remove("wall-warn");
  } else if (minDist <= WALL_DANGER_DIST) {
    canvas.classList.add("wall-warn");
    canvas.classList.remove("wall-danger");
  } else {
    canvas.classList.remove("wall-danger", "wall-warn");
  }
}

function update(elapsed) {
  if (paused) return;

  dir = { x: nextDir.x, y: nextDir.y };
  var head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };

  // Obstacle collision
  for (var oi2 = 0; oi2 < obstacles.length; oi2++) {
    if (obstacles[oi2].x === head.x && obstacles[oi2].y === head.y) {
      return triggerDeath(head);
    }
  }

  var ghostActive = activePower && activePower.id === "ghost";
  if (ghostActive) {
    if (head.x < 0) head.x = COLS - 1;
    if (head.x >= COLS) head.x = 0;
    if (head.y < 0) head.y = ROWS - 1;
    if (head.y >= ROWS) head.y = 0;
  }

  if (!ghostActive) {
    if (head.x < 0 || head.x >= COLS || head.y < 0 || head.y >= ROWS) {
      return triggerDeath(head);
    }
    if (snake.some(function(s) { return s.x === head.x && s.y === head.y; })) {
      return triggerDeath(head);
    }
  } else {
    if (snake.some(function(s) { return s.x === head.x && s.y === head.y; })) {
      return triggerDeath(head);
    }
  }

  updateWallDanger(head);

  snake.unshift(head);

  // Check power food collision
  if (powerFood && head.x === powerFood.x && head.y === powerFood.y) {
    activePower = powerFood.type;
    powerTimer = activePower.duration;
    powerFood = null;
    spawnParticles(head.x, head.y, activePower.color, 20);
    shakeIntensity = 6;
    sfxPowerUp();
    if (activePower.id === 'tornado') sfxTornado();
    applyPowerEffect();
    updatePowerUI();
  }

  // Tornado: pull all foods toward snake head
  if (activePower && activePower.id === 'tornado' && foods.length > 0) {
    for (var ti = 0; ti < foods.length; ti++) {
      var tf = foods[ti];
      var tdx = head.x - tf.x;
      var tdy = head.y - tf.y;
      if (tdx !== 0) tf.x += tdx > 0 ? 1 : -1;
      if (tdy !== 0) tf.y += tdy > 0 ? 1 : -1;
      tf.x = Math.max(0, Math.min(COLS - 1, tf.x));
      tf.y = Math.max(0, Math.min(ROWS - 1, tf.y));
    }
  }

  // Check normal food collision
  var eatenIdx = -1;
  for (var i = 0; i < foods.length; i++) {
    if (foods[i].x === head.x && foods[i].y === head.y) {
      eatenIdx = i;
      break;
    }
  }

  if (eatenIdx !== -1) {
    var eatenFood = foods[eatenIdx];
    var pts = eatenFood.type.score;
    if (activePower && activePower.id === "diamond") pts *= 3;
    if (activePower && activePower.id === "lightning") pts *= 2;

    // Combo check
    var now = Date.now();
    if (lastEatTime > 0 && (now - lastEatTime) < COMBO_WINDOW) {
      combo++;
      var bonus = combo * 5;
      pts += bonus;
      sfxCombo(combo);
      spawnComboPop(eatenFood.x, eatenFood.y, "×" + combo + " +" + bonus);
    } else {
      combo = 0;
      sfxEat();
    }
    lastEatTime = now;

    score += pts;
    totalEaten++;
    scoreEl.textContent = score;
    eatenEl.textContent = totalEaten;
    statsPanel.style.display = "block";
    growing += eatenFood.type.score === 20 ? 2 : 1;
    spawnParticles(eatenFood.x, eatenFood.y, eatenFood.type.color);
    var popColor = '#4ade80';
    if (combo >= 3) popColor = '#facc15';
    else if (activePower && activePower.id === 'diamond') popColor = '#38bdf8';
    else if (activePower && activePower.id === 'lightning') popColor = '#f97316';
    else if (pts >= 20) popColor = '#c084fc';
    spawnScorePopup(eatenFood.x, eatenFood.y, '+' + pts, popColor);
    foods.splice(eatenIdx, 1);
    updateLevelProgress();
    checkLevelUp();
    placeFoods();
    trySpawnPower();
  }

  if (growing > 0) {
    growing--;
  } else {
    snake.pop();
  }

  // Power timer countdown
  if (powerTimer > 0) {
    powerTimer -= speed;
    if (powerTimer <= 0) {
      activePower = null;
      powerTimer = 0;
      speed = baseSpeed;
      canvas.classList.remove("wall-danger", "wall-warn");
      updatePowerUI();
    }
  }

  // Screen shake decay
  if (shakeIntensity > 0) {
    shakeIntensity *= 0.85;
    if (shakeIntensity < 0.3) shakeIntensity = 0;
  }

  // Particles
  for (var j = particles.length - 1; j >= 0; j--) {
    var p = particles[j];
    p.x += p.vx;
    p.y += p.vy;
    p.life -= p.decay;
    if (p.life <= 0) particles.splice(j, 1);
  }
}

function applyPowerEffect() {
  if (activePower.id === "lightning") {
    speed = Math.max(30, baseSpeed / 2);
  } else {
    speed = baseSpeed;
  }
  }

function updateSpeedReadout(value, showNote) {
  speedReadout.textContent = value + "ms/步";
  if (showNote && activePower && activePower.id === "lightning") {
    speedReadout.textContent += " \u26a1";
  }
}
function setBaseSpeed(value) {
  userBaseSpeed = Math.max(60, Math.min(240, parseInt(value, 10) || 140));
  localStorage.setItem("snake_speed_base", String(userBaseSpeed));

// Mute button
var muteBtn = document.getElementById("muteBtn");
var storedMuted = localStorage.getItem("snake_muted");
if (storedMuted === "true") {
  soundMuted = true;
  muteBtn.textContent = "🔇";
  muteBtn.classList.add("muted");
}
muteBtn.addEventListener("click", function() {
  soundMuted = !soundMuted;
  muteBtn.textContent = soundMuted ? "🔇" : "🔊";
  if (soundMuted) muteBtn.classList.add("muted");
  else muteBtn.classList.remove("muted");
  localStorage.setItem("snake_muted", soundMuted.toString());
});

  updateSpeedReadout(Math.round(speed), true);
  if (!gameRunning) return;
  baseSpeed = Math.max(45, userBaseSpeed - (level - 1) * 8);
  speed = baseSpeed;
  if (activePower && activePower.id === "lightning") {
    speed = Math.max(30, baseSpeed / 2);
  }
}

function updatePowerUI() {
  if (activePower && powerTimer > 0) {
    var sec = (powerTimer / 1000).toFixed(1);
    powerEl.textContent = activePower.emoji + " " + activePower.desc + " " + sec + "s";
    powerEl.style.display = "block";
  } else {
    powerEl.style.display = "none";
  }
}

// ── Drawing ───────────────────────────────────────────────

function draw() {
  ctx.save();

  if (shakeIntensity > 0) {
    shakeX = (Math.random() - 0.5) * shakeIntensity * 2;
    shakeY = (Math.random() - 0.5) * shakeIntensity * 2;
    ctx.translate(shakeX, shakeY);
  }

  ctx.clearRect(0, 0, canvas.width, canvas.height);


  // Stars
  var _st = Date.now();
  for (var si = 0; si < stars.length; si++) {
    var star = stars[si];
    var brightness = 0.25 + 0.75 * (0.5 + 0.5 * Math.sin(_st / 1000 * star.speed + star.phase));
    ctx.globalAlpha = brightness;
    ctx.fillStyle = star.color;
    ctx.beginPath();
    ctx.arc(star.x, star.y, star.size, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;

  // Grid
  ctx.strokeStyle = "#14141f";
  ctx.lineWidth = 0.5;
  for (var x = 0; x <= COLS; x++) {
    ctx.beginPath();
    ctx.moveTo(x * GRID, 0);
    ctx.lineTo(x * GRID, canvas.height);
    ctx.stroke();
  }
  for (var y = 0; y <= ROWS; y++) {
    ctx.beginPath();
    ctx.moveTo(0, y * GRID);
    ctx.lineTo(canvas.width, y * GRID);
    ctx.stroke();
  }

  var now = Date.now();


  // Obstacles
  var obsNow = Date.now();
  for (var oi = 0; oi < obstacles.length; oi++) {
    var ob = obstacles[oi];
    var obx = ob.x * GRID + GRID / 2;
    var oby = ob.y * GRID + GRID / 2;
    var pulse = 0.85 + 0.15 * Math.sin(obsNow / 300 + ob.x * 1.7 + ob.y * 2.3);
    var sz = GRID / 2 - 2;
    ctx.save();
    ctx.translate(obx, oby);
    ctx.scale(pulse, pulse);
    ctx.rotate(Math.PI / 4);
    // Outer glow
    var obGrad = ctx.createRadialGradient(0, 0, 0, 0, 0, sz * 1.2);
    obGrad.addColorStop(0, "rgba(168,85,247,0.6)");
    obGrad.addColorStop(0.6, "rgba(124,58,237,0.3)");
    obGrad.addColorStop(1, "transparent");
    ctx.fillStyle = obGrad;
    ctx.beginPath();
    ctx.rect(-sz * 0.7, -sz * 0.7, sz * 1.4, sz * 1.4);
    ctx.fill();
    // Core diamond
    var coreGrad = ctx.createLinearGradient(-sz * 0.6, -sz * 0.6, sz * 0.6, sz * 0.6);
    coreGrad.addColorStop(0, "#c084fc");
    coreGrad.addColorStop(1, "#7c3aed");
    ctx.fillStyle = coreGrad;
    ctx.beginPath();
    ctx.rect(-sz * 0.55, -sz * 0.55, sz * 1.1, sz * 1.1);
    ctx.fill();
    // X pattern
    ctx.strokeStyle = "rgba(255,255,255,0.5)";
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(-sz * 0.4, -sz * 0.4);
    ctx.lineTo(sz * 0.4, sz * 0.4);
    ctx.moveTo(sz * 0.4, -sz * 0.4);
    ctx.lineTo(-sz * 0.4, sz * 0.4);
    ctx.stroke();
    ctx.restore();
  }
  // Power food
  if (powerFood) {
    drawPowerFood(powerFood.x, powerFood.y, powerFood.type, now);
  }

  // Normal food items
  for (var fi = 0; fi < foods.length; fi++) {
    drawFood(foods[fi].x, foods[fi].y, foods[fi].type, now);
  }

  // Snake
  for (var si = 0; si < snake.length; si++) {
    var s = snake[si];
    var t = si / Math.max(snake.length - 1, 1);
    var r, g, b;
    if (activePower && activePower.id === "ghost") {
      r = Math.floor(100 + t * 60);
      g = Math.floor(140 + t * 80);
      b = Math.floor(240 + t * 15);
    } else {
      r = Math.floor(30 + t * 25);
      g = Math.floor(200 + t * 55);
      b = Math.floor(100 + t * 80);
    }
    var alpha = (activePower && activePower.id === "ghost") ? (1 - t * 0.3) * 0.7 : (1 - t * 0.25);

    ctx.fillStyle = "rgba(" + r + "," + g + "," + b + "," + alpha + ")";
    var pad = 1 + t * 0.5;
    var radius = si === 0 ? 5 : 3;
    roundRect(s.x * GRID + pad, s.y * GRID + pad, GRID - pad * 2, GRID - pad * 2, radius);

    if (si === 0) {
      var cx = s.x * GRID + GRID / 2;
      var cy = s.y * GRID + GRID / 2;
      var glowColor;
      if (activePower && activePower.id === "lightning") glowColor = "#facc15";
      else if (activePower && activePower.id === "diamond") glowColor = "#38bdf8";
      else if (activePower && activePower.id === "ghost") glowColor = "#818cf8";
      else if (activePower && activePower.id === "tornado") glowColor = "#a3e635";
      else glowColor = "#4ade80";
      var glowAlpha = activePower ? 0.45 : 0.25;
      if (activePower && activePower.id === "ghost") glowAlpha = 0.35;
      var glowGrad = ctx.createRadialGradient(cx, cy, 0, cx, cy, GRID * 1.1);
      glowGrad.addColorStop(0, glowColor);
      glowGrad.addColorStop(1, "transparent");
      ctx.globalAlpha = glowAlpha;
      ctx.fillStyle = glowGrad;
      ctx.beginPath();
      ctx.arc(cx, cy, GRID * 1.1, 0, Math.PI * 2);
      ctx.fill();
      ctx.globalAlpha = 1;

      var ex1, ey1, ex2, ey2;
      if (dir.x === 1) {
        ex1 = cx + 3; ey1 = cy - 4;
        ex2 = cx + 3; ey2 = cy + 4;
      } else if (dir.x === -1) {
        ex1 = cx - 3; ey1 = cy - 4;
        ex2 = cx - 3; ey2 = cy + 4;
      } else if (dir.y === -1) {
        ex1 = cx - 4; ey1 = cy - 3;
        ex2 = cx + 4; ey2 = cy - 3;
      } else {
        ex1 = cx - 4; ey1 = cy + 3;
        ex2 = cx + 4; ey2 = cy + 3;
      }
      var eyeColor = (activePower && activePower.id === "lightning") ? "#facc15" : "#fff";
      ctx.fillStyle = eyeColor;
      ctx.beginPath(); ctx.arc(ex1, ey1, 2.5, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.arc(ex2, ey2, 2.5, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = "#0a0a0f";
      ctx.beginPath(); ctx.arc(ex1, ey1, 1.2, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.arc(ex2, ey2, 1.2, 0, Math.PI * 2); ctx.fill();
    }
  }

  // Particles
  for (var pi = 0; pi < particles.length; pi++) {
    var p = particles[pi];
    var h = p.color.replace("#", "");
    var rgb = { r: parseInt(h.slice(0, 2), 16), g: parseInt(h.slice(2, 4), 16), b: parseInt(h.slice(4, 6), 16) };
    ctx.fillStyle = "rgba(" + rgb.r + "," + rgb.g + "," + rgb.b + "," + p.life + ")";
    ctx.beginPath();
    ctx.arc(p.x, p.y, 3.5 * p.life, 0, Math.PI * 2);
    ctx.fill();
  }

  ctx.restore();
}

function hexToRgb(hex) {
  var h = hex.replace("#", "");
  return { r: parseInt(h.slice(0, 2), 16), g: parseInt(h.slice(2, 4), 16), b: parseInt(h.slice(4, 6), 16) };
}

function drawPowerFood(gx, gy, type, now) {
  var fx = gx * GRID + GRID / 2;
  var fy = gy * GRID + GRID / 2;
  var pulse = 1 + 0.2 * Math.sin(now / 180);

  ctx.save();
  ctx.translate(fx, fy);
  ctx.scale(pulse, pulse);

  var rot = now / 400;
  ctx.strokeStyle = type.glow;
  ctx.lineWidth = 2;
  ctx.globalAlpha = 0.6;
  for (var i = 0; i < 4; i++) {
    var a = rot + i * Math.PI / 2;
    ctx.beginPath();
    ctx.arc(Math.cos(a) * (GRID / 2 + 1), Math.sin(a) * (GRID / 2 + 1), 4, 0, Math.PI * 2);
    ctx.fillStyle = type.glow;
    ctx.fill();
  }
  ctx.globalAlpha = 1;
  // Peach special rendering: bumpy textured surface
  if (type.id === "peach") {
    var bayColor = type.color;
    var rgbBay = hexToRgb(bayColor);
    // Base body: make it read like a single fruit first, with only light texture.
    var bayGrad = ctx.createRadialGradient(-2, -4, 1, 0, 0, GRID / 2);
    bayGrad.addColorStop(0, type.glow);
    bayGrad.addColorStop(0.38, "#c084fc");
    bayGrad.addColorStop(0.72, bayColor);
    bayGrad.addColorStop(1, "rgb(" + Math.floor(rgbBay.r * 0.28) + "," + Math.floor(rgbBay.g * 0.16) + "," + Math.floor(rgbBay.b * 0.35) + ")");
    ctx.fillStyle = bayGrad;
    ctx.beginPath();
    ctx.arc(0, 1, GRID / 2 - 1.5, 0, Math.PI * 2);
    ctx.fill();

    // Soft shadow / depth on the lower half
    ctx.fillStyle = "rgba(60, 20, 80, 0.18)";
    ctx.beginPath();
    ctx.arc(1, 3, GRID / 2 - 4, 0, Math.PI * 2);
    ctx.fill();

    // Crown-like leafy top so it looks more like a real peach.
    var crownY = -GRID * 0.14;
    ctx.save();
    ctx.translate(0, crownY);
    ctx.fillStyle = "#6d28d9";
    ctx.strokeStyle = "rgba(255,255,255,0.18)";
    ctx.lineWidth = 0.8;
    var leaves = [
      { x: -5, y: 0,   r: 3.4, rot: -0.7 },
      { x: -1.8, y: -3, r: 3.8, rot: -0.1 },
      { x:  1.8, y: -3, r: 3.8, rot: 0.1 },
      { x:  5, y: 0,    r: 3.4, rot: 0.7 },
    ];
    for (var li = 0; li < leaves.length; li++) {
      var leaf = leaves[li];
      ctx.save();
      ctx.translate(leaf.x, leaf.y);
      ctx.rotate(leaf.rot);
      ctx.beginPath();
      ctx.moveTo(0, -leaf.r);
      ctx.quadraticCurveTo(leaf.r * 0.95, -leaf.r * 0.2, 0, leaf.r * 1.35);
      ctx.quadraticCurveTo(-leaf.r * 0.95, -leaf.r * 0.2, 0, -leaf.r);
      ctx.closePath();
      ctx.fill();
      ctx.stroke();
      ctx.restore();
    }
    ctx.fillStyle = "#4ade80";
    ctx.beginPath();
    ctx.arc(0, -1.5, 1.8, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();

    // Light surface texture: a few subtle bumps instead of covering the whole fruit.
    var bumps = [
      { x: -5, y: -2, r: 1.7 }, { x: -2, y: 3, r: 1.9 },
      { x: 2, y: -1, r: 1.8 }, { x: 5, y: 2, r: 1.6 },
      { x: -3, y: 7, r: 1.5 }, { x: 4, y: 6, r: 1.4 },
      { x: 0, y: 8, r: 1.4 }
    ];
    for (var bi = 0; bi < bumps.length; bi++) {
      var bump = bumps[bi];
      drawPeachDetail(bump.x, bump.y, bump.r, bayColor, rgbBay);
    }

    // Highlight
    ctx.fillStyle = "rgba(255,255,255,0.28)";
    ctx.beginPath();
    ctx.arc(-3, -4, 2.2, 0, Math.PI * 2);
    ctx.fill();

    // Emoji on top, kept small so the fruit shape stays visible.
    ctx.fillStyle = "#fff";
    ctx.font = "9px sans-serif";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.scale(1 / pulse, 1 / pulse);
    ctx.fillText(type.emoji, 0, 1);

    ctx.restore();
    return;
  }

  // Tornado rendering
  if (type.id === "tornado") {
    var tr = GRID / 2 + 4;
    var tweak = now / 60;
    for (var tw = 0; tw < 6; tw++) {
      var ta = tweak + tw * Math.PI / 3;
      ctx.fillStyle = type.glow;
      ctx.globalAlpha = 0.35 + 0.25 * Math.sin(tweak * 1.8 + tw);
      ctx.beginPath();
      ctx.arc(Math.cos(ta) * tr * 0.5, Math.sin(ta) * tr * 0.5, 3 + tw * 0.8, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
    var tgrad = ctx.createRadialGradient(-1, -2, 1, 0, 0, GRID / 2);
    tgrad.addColorStop(0, type.glow);
    tgrad.addColorStop(0.3, type.color);
    var trgb = hexToRgb(type.color);
    tgrad.addColorStop(1, "rgb(" + Math.floor(trgb.r * 0.5) + "," + Math.floor(trgb.g * 0.5) + "," + Math.floor(trgb.b * 0.5) + ")");
    ctx.fillStyle = tgrad;
    ctx.beginPath();
    ctx.arc(0, 0, GRID / 2 - 2, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = "rgba(255,255,255,0.3)";
    ctx.beginPath();
    ctx.arc(-2, -2, 3, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = "#fff";
    ctx.font = "12px sans-serif";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.scale(1 / pulse, 1 / pulse);
    ctx.fillText(type.emoji, 0, 0);
    ctx.restore();
    return;
  }


  var grad = ctx.createRadialGradient(-1, -2, 1, 0, 0, GRID / 2);
  grad.addColorStop(0, type.glow);
  grad.addColorStop(0.3, type.color);
  var rgb = hexToRgb(type.color);
  var dr = Math.floor(rgb.r * 0.5);
  var dg = Math.floor(rgb.g * 0.5);
  var db = Math.floor(rgb.b * 0.5);
  grad.addColorStop(1, "rgb(" + dr + "," + dg + "," + db + ")");
  ctx.fillStyle = grad;
  ctx.beginPath();

  var spikes = 8;
  var outerR = GRID / 2 - 2;
  var innerR = GRID / 2 - 5;
  for (var s = 0; s < spikes * 2; s++) {
    var radius = s % 2 === 0 ? outerR : innerR;
    var angle = (Math.PI * 2 * s) / (spikes * 2) - Math.PI / 2;
    var sx = Math.cos(angle) * radius;
    var sy = Math.sin(angle) * radius;
    if (s === 0) ctx.moveTo(sx, sy);
    else ctx.lineTo(sx, sy);
  }
  ctx.closePath();
  ctx.fill();

  ctx.fillStyle = "rgba(255,255,255,0.3)";
  ctx.beginPath();
  ctx.arc(-2, -2, 3, 0, Math.PI * 2);
  ctx.fill();

  ctx.fillStyle = "#fff";
  ctx.font = "12px sans-serif";
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";
  ctx.scale(1 / pulse, 1 / pulse);
  ctx.fillText(type.emoji, 0, 0);

  ctx.restore();
}

function drawPeachDetail(bx, by, r, baseColor, rgb) {
  var bumpGrad = ctx.createRadialGradient(bx - 0.8, by - 1, r * 0.3, bx, by, r);
  bumpGrad.addColorStop(0, "rgb(" + Math.min(255, Math.floor(rgb.r * 1.5)) + "," + Math.min(255, Math.floor(rgb.g * 1.2)) + "," + Math.min(255, Math.floor(rgb.b * 1.3)) + ")");
  bumpGrad.addColorStop(0.55, baseColor);
  bumpGrad.addColorStop(1, "rgb(" + Math.floor(rgb.r * 0.35) + "," + Math.floor(rgb.g * 0.15) + "," + Math.floor(rgb.b * 0.4) + ")");
  ctx.fillStyle = bumpGrad;
  ctx.beginPath();
  ctx.arc(bx, by, r, 0, Math.PI * 2);
  ctx.fill();
}
function drawFood(gx, gy, type, now) {
  var fx = gx * GRID + GRID / 2;
  var fy = gy * GRID + GRID / 2;
  var pulse = 1 + 0.12 * Math.sin((now + gx * 300 + gy * 500) / 220);

  ctx.save();
  ctx.translate(fx, fy);
  ctx.scale(pulse, pulse);

  if (type.id === "peach") {
    var peachColor = type.color;
    var peachRgb = hexToRgb(peachColor);

    // Peach body.
    var peachGrad = ctx.createRadialGradient(-2, -4, 1, 0, 0, GRID / 2);
    peachGrad.addColorStop(0, type.glow);
    peachGrad.addColorStop(0.38, "#fda4af");
    peachGrad.addColorStop(0.74, peachColor);
    peachGrad.addColorStop(1, "rgb(" + Math.floor(peachRgb.r * 0.55) + "," + Math.floor(peachRgb.g * 0.35) + "," + Math.floor(peachRgb.b * 0.35) + ")");
    ctx.fillStyle = peachGrad;
    ctx.beginPath();
    ctx.arc(0, 1, GRID / 2 - 1.8, 0, Math.PI * 2);
    ctx.fill();

    // Slight peach seam.
    ctx.strokeStyle = "rgba(255,255,255,0.16)";
    ctx.lineWidth = 1.1;
    ctx.beginPath();
    ctx.arc(-0.7, 2, GRID / 2 - 4.5, -0.8, 1.1);
    ctx.stroke();

    // Leaf.
    ctx.save();
    ctx.translate(0, -GRID * 0.2);
    ctx.rotate(-0.28);
    ctx.fillStyle = "#22c55e";
    ctx.strokeStyle = "rgba(255,255,255,0.18)";
    ctx.lineWidth = 0.8;
    ctx.beginPath();
    ctx.moveTo(0, -4);
    ctx.quadraticCurveTo(6, -3, 5.2, 1);
    ctx.quadraticCurveTo(2.5, 3.5, 0, 0.8);
    ctx.quadraticCurveTo(-2.5, 3.5, -5.2, 1);
    ctx.quadraticCurveTo(-6, -3, 0, -4);
    ctx.closePath();
    ctx.fill();
    ctx.stroke();
    ctx.restore();

    // Stem.
    ctx.strokeStyle = "#8b5a2b";
    ctx.lineWidth = 1.2;
    ctx.beginPath();
    ctx.moveTo(0, -7);
    ctx.lineTo(1, -11);
    ctx.stroke();

    // Highlight.
    ctx.fillStyle = "rgba(255,255,255,0.28)";
    ctx.beginPath();
    ctx.arc(-3, -4, 2.2, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = "#fff";
    ctx.font = "9px sans-serif";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.scale(1 / pulse, 1 / pulse);
    ctx.fillText(type.emoji, 0, 1);

    ctx.restore();
    return;
  }

  ctx.fillStyle = type.glow;
  ctx.globalAlpha = 0.2;
  ctx.beginPath();
  ctx.arc(0, 0, GRID / 2, 0, Math.PI * 2);
  ctx.fill();
  ctx.globalAlpha = 1;

  var grad = ctx.createRadialGradient(-1, -2, 1, 0, 0, GRID / 2);
  grad.addColorStop(0, type.glow);
  grad.addColorStop(0.45, type.color);
  var rgb = hexToRgb(type.color);
  var dr = Math.floor(rgb.r * 0.55);
  var dg = Math.floor(rgb.g * 0.55);
  var db = Math.floor(rgb.b * 0.55);
  grad.addColorStop(1, "rgb(" + dr + "," + dg + "," + db + ")");
  ctx.fillStyle = grad;
  ctx.beginPath();
  ctx.arc(0, 0, GRID / 2 - 2, 0, Math.PI * 2);
  ctx.fill();

  ctx.fillStyle = "rgba(255,255,255,0.3)";
  ctx.beginPath();
  ctx.arc(-3, -3, 3.5, 0, Math.PI * 2);
  ctx.fill();

  ctx.fillStyle = "#fff";
  ctx.font = "12px sans-serif";
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";
  ctx.scale(1 / pulse, 1 / pulse);
  ctx.fillText(type.emoji, 0, 0);

  ctx.restore();
}

function roundRect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.lineTo(x + w - r, y);
  ctx.quadraticCurveTo(x + w, y, x + w, y + r);
  ctx.lineTo(x + w, y + h - r);
  ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  ctx.lineTo(x + r, y + h);
  ctx.quadraticCurveTo(x, y + h, x, y + h - r);
  ctx.lineTo(x, y + r);
  ctx.quadraticCurveTo(x, y, x + r, y);
  ctx.closePath();
  ctx.fill();
}

function tick() {
  if (!gameRunning) return;
  var now = Date.now();
  var elapsed = lastTickTime ? Math.min(now - lastTickTime, speed * 3) : speed;
  lastTickTime = now;
  update(elapsed);
  draw();
  gameLoop = setTimeout(tick, speed);
}

function triggerDeath(head) {
  clearTimeout(gameLoop);
  gameRunning = false;
  for (var i = 0; i < 110; i++) {
    var angle = Math.random() * Math.PI * 2;
    var spd = 2 + Math.random() * 6;
    var colors = ['#ef4444', '#facc15', '#fff'];
    var clr = colors[Math.floor(Math.random() * colors.length)];
    particles.push({ x: head.x * GRID + GRID / 2 + (Math.random() - 0.5) * GRID, y: head.y * GRID + GRID / 2 + (Math.random() - 0.5) * GRID, vx: Math.cos(angle) * spd, vy: Math.sin(angle) * spd, color: clr, life: 1, decay: 0.008 + Math.random() * 0.012 });
  }
  shakeIntensity = 14;
  var flashEl = document.createElement('div');
  flashEl.style.cssText = 'position:fixed;inset:0;background:rgba(255,0,0,0.6);z-index:9;pointer-events:none;';
  document.body.appendChild(flashEl);
  var dhInterval = setInterval(function() {
    for (var j = particles.length - 1; j >= 0; j--) {
      var p2 = particles[j];
      p2.x += p2.vx; p2.y += p2.vy; p2.life -= p2.decay;
      if (p2.life <= 0) particles.splice(j, 1);
    }
    if (shakeIntensity > 0) { shakeIntensity *= 0.85; if (shakeIntensity < 0.3) shakeIntensity = 0; }
    draw();
  }, 1000 / 60);
  setTimeout(function() { flashEl.style.transition = 'opacity 0.25s'; flashEl.style.opacity = '0'; }, 200);
  setTimeout(function() { clearInterval(dhInterval); flashEl.remove(); particles = []; shakeIntensity = 0; gameOver(); }, 500);
}

function gameOver() {
  clearTimeout(gameLoop);
  gameRunning = false;
  paused = false;
  pauseOverlay.style.display = "none";
  activePower = null;
  powerTimer = 0;
  canvas.classList.remove("wall-danger", "wall-warn");
  powerEl.style.display = "none";
  sfxDeath();
  if (score > best) {
    best = score;
    localStorage.setItem("snake_best", best);
    bestEl.textContent = best;
  }
  countdownArea.innerHTML = "";
  overlayTitle.textContent = "游戏结束";
  overlaySub.textContent = "最终得分";
  overlayTitle.classList.add("title-gameover");
  startExtras.style.display = "none";
  messageArea.style.display = "block";
  overlayScore.style.display = "block";
  overlayScore.textContent = score;
  overlay.style.display = "flex";
  startBtn.textContent = "再来一局";
  overlayHint.style.display = "block";
  overlayHint.textContent = "吃下 " + totalEaten + " 个食物 · 达到等级 " + level;
  startBtn.focus();
}

function doCountdown(num) {
  return new Promise(function(resolve) {
    countdownArea.innerHTML = '<div class="countdown-number">' + num + '</div>';
    sfxCountdown();
    setTimeout(resolve, 600);
  });
}

function startGame() {
  clearTimeout(gameLoop);
  init();
  overlay.style.display = "none";
  overlayScore.style.display = "none";
  overlayHint.style.display = "none";
  startBtn.textContent = "开始游戏";
  draw();
  // Countdown: 3, 2, 1, GO!
  countdownArea.innerHTML = '<div class="countdown-number">3</div>';
  overlay.style.display = "flex";
  messageArea.style.display = "none";
  overlayHint.style.display = "none";
  var doCount = function() {
    doCountdown(3).then(function() {
      return doCountdown(2);
    }).then(function() {
      return doCountdown(1);
    }).then(function() {
      countdownArea.innerHTML = '<div class="countdown-number" style="color:#4ade80">GO!</div>';
      sfxGo();
      setTimeout(function() {
        overlay.style.display = "none";
        countdownArea.innerHTML = "";
        messageArea.style.display = "block";
        gameRunning = true;
        levelPanel.style.display = "block";
        tick();
      }, 400);
    });
  };
  doCount();
}

function setDirection(dx, dy) {
  if (!gameRunning || paused) return;
  if (dx !== 0 && dir.x === -dx) return;
  if (dy !== 0 && dir.y === -dy) return;
  if (dx === 0 && dy === 0) return;
  nextDir = { x: dx, y: dy };
}

function togglePause() {
  if (!gameRunning) return;
  paused = !paused;
  if (paused) {
    clearTimeout(gameLoop);
    pauseOverlay.style.display = "flex";
    document.getElementById("resumeBtn").focus();
  } else {
    lastTickTime = 0;
    pauseOverlay.style.display = "none";
    tick();
  }
}

// ── Input ─────────────────────────────────────────────────
document.addEventListener("keydown", function(e) {
  if (overlay.style.display === "flex") {
    if (e.key === "Enter" || e.key === " ") startGame();
    return;
  }
  switch (e.key) {
    case "ArrowUp": case "w": case "W": e.preventDefault(); setDirection(0, -1); break;
    case "ArrowDown": case "s": case "S": e.preventDefault(); setDirection(0, 1); break;
    case "ArrowLeft": case "a": case "A": e.preventDefault(); setDirection(-1, 0); break;
    case "ArrowRight": case "d": case "D": e.preventDefault(); setDirection(1, 0); break;
    case " ": e.preventDefault(); togglePause(); break;
    case "Escape": e.preventDefault(); togglePause(); break;
  }
});

document.querySelectorAll(".ctrl-btn").forEach(function(btn) {
  btn.addEventListener("click", function() {
    if (overlay.style.display === "flex") return;
    var d = btn.dataset.dir;
    if (d === "up") setDirection(0, -1);
    if (d === "down") setDirection(0, 1);
    if (d === "left") setDirection(-1, 0);
    if (d === "right") setDirection(1, 0);
  });
});

speedSlider.addEventListener("input", function() {
  setBaseSpeed(speedSlider.value);
});

// ── Touch / Swipe ────────────────────────────────────────
var touchStartX = 0, touchStartY = 0, touchStartTime = 0, swipeHandled = false;
canvas.addEventListener("touchstart", function(e) {
  if (overlay.style.display === "flex") return;
  if (paused && gameRunning) { togglePause(); return; }
  touchStartX = e.touches[0].clientX;
  touchStartY = e.touches[0].clientY;
  touchStartTime = Date.now();
  swipeHandled = false;
  e.preventDefault();
}, { passive: true });

canvas.addEventListener("touchmove", function(e) {
  if (overlay.style.display === "flex") return;
  if (swipeHandled) return;
  var dx = e.touches[0].clientX - touchStartX;
  var dy = e.touches[0].clientY - touchStartY;
  if (Math.abs(dx) < 28 && Math.abs(dy) < 28) return;
  swipeHandled = true;
  if (Math.abs(dx) > Math.abs(dy)) {
    setDirection(dx > 0 ? 1 : -1, 0);
  } else {
    setDirection(0, dy > 0 ? 1 : -1);
  }
}, { passive: true });

startBtn.addEventListener("click", startGame);

canvas.addEventListener("click", function() {
  if (paused && gameRunning) togglePause();
});

init();
draw();
</script>
</body>
</html>
